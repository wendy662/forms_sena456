<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Formulario Sena v3</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' href="style.css"
</head>
<body>
    <h1>Formulario Sena</h1><p></p>
    <h6>Gracias por dejar sus datos</h6>
    <div class="contenedor">
        <div class="div-formulario">
            <form action = "#" id = "Formulario">
                 <label for="nombre" class="form-label">Nombre</label><br>
                <input type = "text" id = "nombre" placeholder = "Ingrese su nombre" required><br>
                 <label for="nombre" class="form-label">Email</label></label><br>
                <input type = "email" id = "email" placeholder = "Ingresa su email" required><br>
                 <label for="nombre" class="form-label">Edad</label><br>
                <input type = "number" id = "edad" placeholder = "Ingresa su edad" required><br>
            </form><p></p>

            <label for="option">Selecciona una opción:</label>
            <select id="option" name="option">
            <option value="opcion1">Opcion a</option>
            <option value="opcion2">Opcion b</option>
            <option value="opcion3">opcion c</option>
            </select>

            <form>
            <p>Tienes planeado comprar un carro nuevo en los proximos 5 años </p>
            <label><input type="radio" name="opcion" value="opcion1"> Si</label><br>
            <label><input type="radio" name="opcion" value="opcion2"> No</label><br>
            <label><input type="radio" name="opcion" value="opcion3"> Tal vez</label><p>
            </form>
             
            <form>
            <label for="option">Cual es tu marca favorita de carro:</label>
            <select id="option" name="option">
            <option value="opcion1">Chevrolet</option><b></b>
            <option value="opcion2">Toyota</option>
            <option value="opcion3">Nissan</option><p>
            </select>
            </form>

            <form>
            <label for="transport">¿Qué medio de transporte posee?</label><br>
            <div>
                <input type="checkbox" id="car" name="transport" value="Car">
                <label for="car">Car</label><br>
                <input type="checkbox" id="boat" name="transport" value="Boat">
                <label for="boat">Boat</label><br>
                <input type="checkbox" id="bicycle" name="transport" value="Bicycle">
                <label for="bicycle">Bicycle</label><br>
                <input type="checkbox" id="motorcycle" name="transport" value="Motorcycle">
                <label for="motorcycle">Motorcycle</label><br>
                <input type="checkbox" id="plane" name="transport" value="Plane">
                <label for="plane">Plane</label><br>
                <input type="checkbox" id="bike" name="transport" value="Bike">
                <label for="bike">Bike</label><p>
            </div>
            </form>
            <label for="Comentario">¿Algún comentario o sugerencia?</label><p>
            <textarea placeholder="Escribe aquí"></textarea>
                        <button type="submit">Enviar</button>
    </div>
</body>
</html>
